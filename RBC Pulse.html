 Hub<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n<div style=\"display:flex;background:#E6EEF9;border-radius:999px;padding:4px;gap:2px\" role=\"group\" aria-label=\"Switch demo view\">\n<sc-for list=\"{{roles}}\" as=\"r\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<nav aria-label=\"Sections\" style=\"max-width:1320px;margin:0 auto;padding:0 28px;display:flex;gap:32px;flex-wrap:wrap\">\n<sc-for list=\"{{nav}}\" as=\"n\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ n.pick }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fnav>\n<\u002Fdiv>\n\n<!-- BODY: content -->\n<div style=\"max-width:1320px;margin:0 auto;padding:28px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start\">\n\n<!-- CONTENT -->\n<div style=\"flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:24px\">\n\n<!-- ============ HOME ============ -->\n<sc-if value=\"{{isHome}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:linear-gradient(100deg,#F4E5A3 0%,#D3E8CF 42%,#BEE0F6 100%);border-radius:18px;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 24px;padding-left:44px;min-height:0\">\n<div style=\"flex:1 1 420px;min-width:0;padding:36px 0;color:#0B1F3A\">\n<h1 style=\"margin:0 0 16px;font-family:'Alegreya Sans','Inter',sans-serif;font-size:58px;line-height:1.03;font-weight:700;letter-spacing:-0.01em;color:#0051A5\">How is your experience really going?<\u002Fh1>\n<p style=\"margin:0;font-size:18px;line-height:1.55;color:#2B4468;max-width:560px\">Share how you feel, any time. Honest feedback on onboarding, mentorship, training or your team reaches the people who can fix it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:0 1 460px;min-width:280px;align-self:flex " r=\"6.5\" fill=\"#E8867A\" opacity=\"0.6\"><\u002Fcircle><path d=\"M-30-30C-28-50-4-58 16-52C2-46-12-36-18-20C-24-26-28-28-30-30Z\" fill=\"#4A2478\"><\u002Fpath><path d=\"M-18-52C2-62 30-54 38-26\" fill=\"none\" stroke=\"#FFFFFF\" stroke-opacity=\"0.30\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fg><g transform=\"translate(452,214)\"><path d=\"M-26-40C-6-66 40-58 44-14C47 18 40 46 26 54L-2 38L8-10Z\" fill=\"#5A2E9A\"><\u002Fpath><path d=\"M-12 16L14 16L16 76L-16 76Z\" fill=\"#B9B3CB\"><\u002Fpath><path d=\"M-12 22L14 22L15 46C3 54-8 50-12 42Z\" fill=\"#000\" opacity=\"0.10\"><\u002Fpath><path d=\"M-68 250C-68 100-34 68 0 68C36 68 70 100 70 250Z\" fill=\"#E2A93B\"><\u002Fpath><path d=\"M-15 68C-8 86 8 86 18 68Z\" fill=\"#B9B3CB\"><\u002Fpath><path d=\"M-24 16Q0 4 20 16\" fill=\"none\" stroke=\"#000\" stroke-opacity=\"0.07\" stroke-width=\"2\"><\u002Fpath><path d=\"M24-6C24-40 4-54-14-50C-28-46-33-32-31-24L-38-12L-31-8C-32 2-30 18-20 28C-12 36 6 40 18 30C22 22 24 10 24-6Z\" fill=\"#B9B3CB\"><\u002Fpath><path d=\"M12 18C14 26 10 34 4 36\" fill=\"none\" stroke=\"#000\" stroke-opacity=\"0.08\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"-10\" cy=\"6\" r=\"6.5\" fill=\"#E8867A\" opacity=\"0.6\"><\u002Fcircle><path d=\"M-30-30C-28-50-4-58 16-52C2-46-12-36-18-20C-24-26-28-28-30-30Z\" fill=\"#5A2E9A\"><\u002Fpath><path d=\"M-18-52C2-62 30-54 38-26\" fill=\"none\" stroke=\"#FFFFFF\" stroke-opacity=\"0.30\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fg><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;align-items:stretch\">\n<div style=\"min-width:0;background:#FFFFFF;border:1px solid #D9E2EE;border-radius:14px;padding:28px;color:#0B1F3A;display:flex;flex-direction:column\">\n<sc-if value=\"{{showForm}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:18px;flex:1 1 auto\">\n<div style=\"display:flex;gap:20px;flex-wrap:wrap\" role=\"group\" aria-label=\"What is this about\">\n<sc-for list=\"{{topicTabs}}\" as=\"tt\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{ tt.pick }}\" aria-pressed=\"{{ tt.on }}\" style=\"{{ tt.style }}\">{{ tt.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:34px;line-height:1.1;font-weight:700;color:#0051A5\">{{stopPrompt}}<\u002Fdiv>\n<div style=\"font-size:13px;color:#4A5D78;margin-top:6px\">About {{stopName}} · takes 30 seconds<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em;margin-bottom:8px\">PROGRAM<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<sc-for list=\"{{programs}}\" as=\"p\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ p.pick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em;margin-bottom:8px\">HOW ARE YOU FEELING?<\u002Fdiv>\n<div style=\"display:flex;gap:10px\">\n<button type=\"button\" aria-label=\"Good\" sc-camel-on-click=\"{{ pickGood }}\" style=\"{{ goodStyle }}\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 14s1.5 2.5 4 2.5S16 14 16 14\"><\u002Fpath><path d=\"M9 9.5h.01M15 9.5h.01\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size:13px;font-weight:600\">Good<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" aria-label=\"Okay\" sc-camel-on-click=\"{{ pickOk }}\" style=\"{{ okStyle }}\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 15h8\"><\u002Fpath><path d=\"M9 9.5h.01M15 9.5h.01\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size:13px;font-weight:600\">Okay<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" aria-label=\"Struggling\" sc-camel-on-click=\"{{ pickBad }}\" style=\"{{ badStyle }}\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 16s1.5-2.5 4-2.5S16 16 16 16\"><\u002Fpath><path d=\"M9 9.5h.01M15 9.5h.01\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size:13px;font-weight:600\">Struggling<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<label for=\"note\" style=\"display:block;font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em;margin-bottom:8px\">ANYTHING ELSE? (OPTIONAL)<\u002Flabel>\n<textarea id=\"note\" rows=\"3\" sc-camel-on-input=\"{{ onText }}\" placeholder=\"What's working, what's confusing, what would help?\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #B9C7DB;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;resize:vertical;color:#0B1F3A\"><\u002Ftextarea>\n<div style=\"font-size:12px;color:#4A5D78;margin-top:6px\">Please leave out names and personal details.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<label style=\"display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.45;color:#0B1F3A\">\n<input type=\"checkbox\" checked=\"{{ share }}\" sc-camel-on-change=\"{{ toggleShare }}\" style=\"width:22px;height:22px;margin:0;flex:0 0 22px;accent-color:#0051A5\">\n<span><strong>Share with other interns<\u002Fstrong><br><span style=\"color:#4A5D78\">Post this on the Feedback tracker so others who feel the same can back it. Still anonymous.<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<div style=\"font-size:13px;color:#8A5A00;margin-top:6px;min-height:18px\">{{shareHint}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:auto\"><button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"{{ submitStyle }}\">{{submitLabel}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:8px 0\">\n<div style=\"width:52px;height:52px;border-radius:50%;background:#E6F4EA;display:flex;align-items:center;justify-content:center\" aria-hidden=\"true\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B6B2E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:34px;font-weight:700;color:#0051A5\">Thanks, that helps.<\u002Fdiv>\n<p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A5D78\">Added to the {{summaryProgram}} · {{summaryTopic}} pulse. Nothing in it identifies you. {{sentNote}}<\u002Fp>\n<sc-if value=\"{{sentShared}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ goUpdates }}\" style=\"background:#0051A5;color:#FFFFFF;border:none;font-weight:700;font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer;min-height:44px\">See it on the tracker<\u002Fbutton>\n<\u002Fsc-if>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ again }}\" style=\"background:#FFFFFF;border:2px solid #0051A5;color:#0051A5;font-weight:700;font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer;min-height:44px\">Share something else<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ undoSend }}\" style=\"background:none;border:none;color:#0051A5;font-weight:700;font-size:15px;cursor:pointer;min-height:44px;padding:0 6px\">Undo<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n<div style=\"flex:1 1 auto;min-width:0;background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:30px;font-weight:700;color:#0051A5\">My career path<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ goCareer }}\" style=\"background:none;border:none;color:#0051A5;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px\">Open →<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font-size:15px;color:#4A5D78\">Target role: <strong style=\"color:#0B1F3A\">{{roleTitle}}<\u002Fstrong><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<div style=\"flex:1;height:10px;background:#E6EEF9;border-radius:999px;overflow:hidden\"><div style=\"{{ progressBar }}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:14px;font-weight:700;color:#003168\">{{progress}}%<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:14px;color:#4A5D78\">You match {{matched}} of {{totalSkills}} required skills.<\u002Fdiv>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:26px;font-weight:700;color:#0051A5;margin-top:6px\">Next up<\u002Fdiv>\n<ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n<sc-for list=\"{{quickWins}}\" as=\"q\" hint-placeholder-count=\"2\">\n<li style=\"border-top:1px solid #D9E2EE\"><button type=\"button\" sc-camel-on-click=\"{{ goCareer }}\" style=\"display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;background:none;border:none;padding:12px 0;font-size:15px;line-height:1.5;color:#0B1F3A;cursor:pointer;min-height:44px\"><span style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:24px;font-weight:700;color:#0051A5\">{{ q.n }}<\u002Fspan><span>{{ q.text }}<\u002Fspan><\u002Fbutton><\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<button type=\"button\" sc-camel-on-click=\"{{ goCareer }}\" style=\"background:none;border:none;border-top:1px solid #D9E2EE;width:100%;text-align:left;color:#0051A5;font-weight:700;font-size:15px;cursor:pointer;min-height:44px;padding:12px 0 0\">Continue on my career path →<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"flex:1 1 auto;min-width:0;background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:30px;font-weight:700;color:#0051A5\">Feedback tracker<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ goUpdates }}\" style=\"background:none;border:none;color:#0051A5;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px\">Open tracker →<\u002Fbutton>\n<\u002Fdiv>\n<sc-for list=\"{{homeUpdates}}\" as=\"u\" hint-placeholder-count=\"2\">\n<div style=\"border-top:1px solid #D9E2EE;padding:14px 0 4px\">\n<div style=\"font-size:13px;color:#4A5D78\">{{ u.program }} · {{ u.topic }}<\u002Fdiv>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:22px;font-style:italic;line-height:1.3;margin-top:4px\">\"{{ u.said }}\"<\u002Fdiv>\n<div style=\"font-size:15px;line-height:1.5;color:#003168;margin-top:6px\">{{ u.line }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ CAREER ============ -->\n<sc-if value=\"{{isCareer}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.01em;color:#0051A5\">Career path<\u002Fdiv>\n<div style=\"font-size:16px;color:#4A5D78;margin-top:6px\">Pick an interest, choose a role, rate your skills, then follow the steps to get there.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em\">1 · WHAT AREA INTERESTS YOU?<\u002Fdiv>\n<div style=\"display:flex;gap:28px;flex-wrap:wrap\">\n<sc-for list=\"{{interests}}\" as=\"i\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{ i.pick }}\" style=\"{{ i.style }}\">{{ i.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em\">2 · PICK A ROLE (SUGGESTED FOR THIS AREA)<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px\">\n<sc-for list=\"{{roleCards}}\" as=\"rc\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ rc.pick }}\" style=\"{{ rc.style }}\">\n<span style=\"font-size:17px;font-weight:700;color:#003168\">{{ rc.title }}<\u002Fspan>\n<span style=\"font-size:14px;line-height:1.45;color:#4A5D78;font-weight:400\">{{ rc.blurb }}<\u002Fspan>\n<span style=\"font-size:12px;font-weight:600;color:#0051A5\">Example team: {{ rc.team }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n<div style=\"flex:1 1 100%;min-width:0;background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n<div>\n<div style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em\">3 · RATE YOUR SKILLS FOR<\u002Fdiv>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:34px;font-weight:700;color:#0051A5;margin-top:4px\">{{roleTitle}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"color:#003168;font-weight:700;font-size:15px\">{{matched}}/{{totalSkills}} skills match<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0;margin-top:6px\">\n<sc-for list=\"{{skills}}\" as=\"sk\" hint-placeholder-count=\"5\">\n<div style=\"border-top:1px solid #D9E2EE;padding:18px 0;display:flex;flex-wrap:wrap;gap:14px 32px;align-items:center\">\n<div style=\"flex:0 0 190px;font-family:'Alegreya Sans','Inter',sans-serif;font-size:24px;font-weight:700;color:#0B1F3A\">{{ sk.name }}<span style=\"{{ sk.okStyle }}\">✓<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:6px;flex:none\" role=\"group\" aria-label=\"Your level in {{ sk.name }}\">\n<sc-for list=\"{{sk.levels}}\" as=\"lv\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{ lv.pick }}\" aria-label=\"{{ lv.aria }}\" style=\"{{ lv.style }}\">{{ lv.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"flex:1 1 320px;min-width:0;display:flex;flex-wrap:wrap;gap:10px 28px\">\n<div style=\"flex:1 1 200px;min-width:0\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#4A5D78\">YOU<\u002Fdiv>\n<div style=\"font-size:15px;line-height:1.45;color:#0B1F3A;margin-top:2px\"><strong>{{ sk.youName }}<\u002Fstrong> · {{ sk.youDesc }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 200px;min-width:0;{{ sk.needHide }}\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;color:#4A5D78\">ROLE NEEDS<\u002Fdiv>\n<div style=\"font-size:15px;line-height:1.45;color:#0B1F3A;margin-top:2px\"><strong>{{ sk.needName }}<\u002Fstrong> · {{ sk.needDesc }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;align-items:stretch\">\n<div style=\"flex:1 1 320px;min-width:0;background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:30px;font-weight:700;color:#0051A5\">Your roadmap<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<div style=\"flex:1;height:10px;background:#E6EEF9;border-radius:999px;overflow:hidden\"><div style=\"{{ progressBar }}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:14px;font-weight:700;color:#003168\">{{progress}}%<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0\">\n<sc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"4\">\n<button type=\"button\" aria-pressed=\"{{ st.pressed }}\" sc-camel-on-click=\"{{ st.toggle }}\" style=\"{{ st.style }}\">\n<span style=\"{{ st.boxStyle }}\">{{ st.mark }}<\u002Fspan>\n<span style=\"font-size:14px;line-height:1.45;text-align:left;font-weight:500\">{{ st.text }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 320px;min-width:0;background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:30px;font-weight:700;color:#0051A5\">Recommended next steps<\u002Fdiv>\n<sc-for list=\"{{gapSkills}}\" as=\"g\" hint-placeholder-count=\"2\">\n<details open=\"\" style=\"border-top:1px solid #D9E2EE;padding:10px 0\">\n<summary style=\"font-size:16px;font-weight:700;color:#003168;cursor:pointer;min-height:44px;display:flex;align-items:center\">{{ g.name }}<\u002Fsummary>\n<div style=\"display:flex;flex-direction:column;margin:4px 0 6px\">\n<sc-for list=\"{{ g.links }}\" as=\"rl\" hint-placeholder-count=\"2\">\n<div style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid #D9E2EE\">\n<a href=\"{{ rl.href }}\" style=\"display:block;text-decoration:none;min-width:0;flex:1 1 220px\">\n<div style=\"font-size:15px;font-weight:700;color:#0051A5;text-decoration:underline\">{{ rl.title }}<\u002Fdiv>\n<div style=\"font-size:13px;color:#4A5D78;margin-top:2px\">{{ rl.meta }}<\u002Fdiv>\n<\u002Fa>\n<button type=\"button\" aria-pressed=\"{{ rl.inPlan }}\" sc-camel-on-click=\"{{ rl.toggle }}\" style=\"{{ rl.btnStyle }}\">{{ rl.label }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdetails>\n<\u002Fsc-for>\n<sc-if value=\"{{noGaps}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:15px;color:#0B6B2E;font-weight:600\">No gaps. You meet every skill for this role.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"flex:1 1 320px;min-width:0;background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:30px;font-weight:700;color:#0051A5\">My learning plan ({{planCount}})<\u002Fdiv>\n<sc-if value=\"{{planEmpty}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-size:14px;color:#4A5D78\">Nothing saved yet.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-direction:column\">\n<sc-for list=\"{{planItems}}\" as=\"pi\" hint-placeholder-count=\"2\">\n<div style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #D9E2EE\">\n<div style=\"font-size:15px;color:#0B1F3A;min-width:0\">{{ pi.text }}<\u002Fdiv>\n<button type=\"button\" aria-label=\"{{ pi.aria }}\" sc-camel-on-click=\"{{ pi.remove }}\" style=\"background:none;border:none;color:#0051A5;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px;flex:none\">Remove<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ BROWSER EXTENSION ============ -->\n<sc-if value=\"{{isReader}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.01em;color:#0051A5\">Browser extension<\u002Fdiv>\n<div style=\"font-size:16px;color:#4A5D78;margin-top:6px;max-width:760px\">The same hub, one click away while browsing. It reads a job posting and shows your skill match, and it asks for a one-tap pulse on training pages. This is a working preview of both.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<sc-for list=\"{{extTabs}}\" as=\"et\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ et.pick }}\" style=\"{{ et.style }}\">{{ et.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"background:#FFFFFF;border:1px solid #B9C7DB;border-radius:12px;overflow:hidden\">\n<div style=\"background:#E6EEF9;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n<div style=\"display:flex;gap:6px\" aria-hidden=\"true\"><div style=\"width:11px;height:11px;border-radius:50%;background:#B9C7DB\"><\u002Fdiv><div style=\"width:11px;height:11px;border-radius:50%;background:#B9C7DB\"><\u002Fdiv><div style=\"width:11px;height:11px;border-radius:50%;background:#B9C7DB\"><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 200px;min-width:0;background:#FFFFFF;border-radius:999px;padding:8px 16px;font-size:13px;color:#4A5D78;overflow:hidden;white-space:nowrap;text-overflow:ellipsis\">{{pageUrl}}<\u002Fdiv>\n<div style=\"position:relative;width:36px;height:36px;border-radius:8px;background:#0051A5;display:flex;align-items:center;justify-content:center\" aria-hidden=\"true\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FEDF01\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l3-7 4 14 3-7h4\"><\u002Fpath><\u002Fsvg>\n<div style=\"position:absolute;top:-6px;right:-6px;background:#FEDF01;color:#003168;font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center\">2<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:0;align-items:stretch\">\n<!-- fake page -->\n<div style=\"flex:1 1 420px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:14px\">\n<sc-if value=\"{{extPosting}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em\">JOB POSTING · EXAMPLE<\u002Fdiv>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:38px;font-weight:700;color:#0051A5\">{{roleTitle}}<\u002Fdiv>\n<div style=\"font-size:14px;color:#4A5D78\">{{roleTeam}} · Toronto · Hybrid<\u002Fdiv>\n<div style=\"font-size:15px;line-height:1.6;color:#0B1F3A\">{{roleBlurb}}<\u002Fdiv>\n<div style=\"font-size:16px;font-weight:700;margin-top:6px\">What you'll bring<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{skills}}\" as=\"sk\" hint-placeholder-count=\"5\">\n<div style=\"font-size:15px;line-height:1.5\">Working knowledge of <span style=\"{{ sk.hlStyle }}\">{{ sk.name }}<\u002Fspan> at level {{ sk.need }} or higher<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:16px;font-size:13px;color:#4A5D78;margin-top:8px;flex-wrap:wrap\">\n<span><span style=\"background:#E6F4EA;padding:2px 8px;border-radius:4px;color:#0B6B2E;font-weight:600\">Green<\u002Fspan> you match<\u002Fspan>\n<span><span style=\"background:#FFF1A8;padding:2px 8px;border-radius:4px;color:#3F3200;font-weight:600;border-bottom:2px solid #C9A800\">Yellow<\u002Fspan> gap<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{extTraining}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em\">LEARNING PORTAL · EXAMPLE<\u002Fdiv>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:38px;font-weight:700;color:#0051A5\">Module 3: Working with data safely<\u002Fdiv>\n<div style=\"background:#0B1F3A;border-radius:12px;height:200px;display:flex;align-items:center;justify-content:center\" aria-hidden=\"true\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M10 8l6 4-6 4z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-size:15px;line-height:1.6;color:#4A5D78\">The extension spots that you're on a training or onboarding page and offers a one-tap pulse, so feedback is specific to this module and arrives while it's fresh.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<!-- extension panel -->\n<div style=\"flex:0 1 360px;min-width:300px;background:#F4F7FB;border-left:1px solid #D9E2EE;padding:20px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<div style=\"width:28px;height:28px;border-radius:7px;background:#0051A5;display:flex;align-items:center;justify-content:center\" aria-hidden=\"true\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FEDF01\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l3-7 4 14 3-7h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"font-weight:800;font-size:16px;color:#003168\">Pulse<\u002Fdiv>\n<div style=\"margin-left:auto;font-size:12px;color:#4A5D78\">ID 7F3K<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{extPosting}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:13px;color:#4A5D78\">Skill match for<\u002Fdiv>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:26px;font-weight:700;color:#0051A5\">{{roleTitle}}<\u002Fdiv>\n<div style=\"font-size:30px;font-weight:800;color:#0051A5\">{{matched}}/{{totalSkills}} <span style=\"font-size:14px;font-weight:600;color:#4A5D78\">skills<\u002Fspan><\u002Fdiv>\n<div style=\"height:8px;background:#E6EEF9;border-radius:999px;overflow:hidden\"><div style=\"{{ matchBar }}\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:14px;font-weight:700;color:#003168\">Missing skills<\u002Fdiv>\n<sc-for list=\"{{gapSkills}}\" as=\"g\" hint-placeholder-count=\"2\">\n<details style=\"border:1px solid #D9E2EE;border-radius:10px;padding:10px 12px\">\n<summary style=\"font-size:14px;font-weight:700\">{{ g.name }}<\u002Fsummary>\n<div style=\"display:flex;flex-direction:column;margin:4px 0 6px\">\n<sc-for list=\"{{ g.links }}\" as=\"rl\" hint-placeholder-count=\"2\">\n<div style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid #D9E2EE\">\n<a href=\"{{ rl.href }}\" style=\"display:block;text-decoration:none;min-width:0;flex:1 1 220px\">\n<div style=\"font-size:15px;font-weight:700;color:#0051A5;text-decoration:underline\">{{ rl.title }}<\u002Fdiv>\n<div style=\"font-size:13px;color:#4A5D78;margin-top:2px\">{{ rl.meta }}<\u002Fdiv>\n<\u002Fa>\n<button type=\"button\" aria-pressed=\"{{ rl.inPlan }}\" sc-camel-on-click=\"{{ rl.toggle }}\" style=\"{{ rl.btnStyle }}\">{{ rl.label }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<\u002Fdetails>\n<\u002Fsc-for>\n<sc-if value=\"{{noGaps}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:14px;color:#0B6B2E;font-weight:600\">You match every skill. Nice.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"background:#FFF7BF;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5;color:#3F3200\">\n<strong>Update:<\u002Fstrong> Onboarding felt confusing for others too, so a first-week checklist was added.\n<\u002Fdiv>\n<div style=\"font-size:12px;color:#4A5D78\">Change your ratings in the Career path tab to see the match update here.<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{extTraining}}\" hint-placeholder-val=\"{{ false }}\">\n<sc-if value=\"{{trainOpen}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#FFFFFF;border:1px solid #D9E2EE;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:26px;font-weight:700;color:#0051A5\">How was this training?<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<button type=\"button\" aria-label=\"Good\" sc-camel-on-click=\"{{ tGood }}\" style=\"{{ tGoodStyle }}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 14s1.5 2.5 4 2.5S16 14 16 14\"><\u002Fpath><path d=\"M9 9.5h.01M15 9.5h.01\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button type=\"button\" aria-label=\"Okay\" sc-camel-on-click=\"{{ tOk }}\" style=\"{{ tOkStyle }}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 15h8\"><\u002Fpath><path d=\"M9 9.5h.01M15 9.5h.01\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button type=\"button\" aria-label=\"Poor\" sc-camel-on-click=\"{{ tBad }}\" style=\"{{ tBadStyle }}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 16s1.5-2.5 4-2.5S16 16 16 16\"><\u002Fpath><path d=\"M9 9.5h.01M15 9.5h.01\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<label for=\"tnote\" style=\"font-size:12px;font-weight:700;color:#4A5D78;letter-spacing:0.05em\">OPTIONAL COMMENT<\u002Flabel>\n<textarea id=\"tnote\" rows=\"2\" placeholder=\"Too fast? Too basic? Tell us.\" style=\"width:100%;box-sizing:border-box;border:1.5px solid #B9C7DB;border-radius:10px;padding:10px 12px;font-size:14px;resize:vertical\"><\u002Ftextarea>\n<button type=\"button\" sc-camel-on-click=\"{{ tSend }}\" style=\"{{ tSendStyle }}\">Send anonymously<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{trainSent}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#E6F4EA;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:17px;font-weight:800;color:#0B6B2E\">Sent. Thank you!<\u002Fdiv>\n<div style=\"font-size:14px;line-height:1.5;color:#1D4D2B\">Tagged to this module only. No name or email attached.<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ tAgain }}\" style=\"background:#FFFFFF;border:2px solid #0B6B2E;color:#0B6B2E;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px\">Undo<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ FEEDBACK TRACKER ============ -->\n<sc-if value=\"{{isUpdates}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.01em;color:#0051A5\">Feedback tracker<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:1px solid #D9E2EE\">\n<div>\n<sc-if value=\"{{isStuTracker}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;gap:32px;flex-wrap:wrap\" role=\"group\" aria-label=\"Issue lists\">\n<sc-for list=\"{{trackTabs}}\" as=\"tb\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ tb.pick }}\" aria-pressed=\"{{ tb.on }}\" style=\"{{ tb.style }}\">{{ tb.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;gap:20px;flex-wrap:wrap;padding-bottom:10px\">\n<label style=\"display:flex;align-items:center;gap:8px;font-size:14px;color:#4A5D78\">Show\n<sc-raw-select sc-camel-on-change=\"{{ onFilter }}\" style=\"font-family:inherit;font-size:15px;font-weight:600;color:#0051A5;background:#FFFFFF;border:1px solid #B9C7DB;border-radius:8px;padding:8px 10px;min-height:40px;cursor:pointer\">\n<sc-for list=\"{{filterOpts}}\" as=\"fo\" hint-placeholder-count=\"3\"><option value=\"{{ fo.value }}\" selected=\"{{ fo.sel }}\">{{ fo.label }}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Flabel>\n<label style=\"display:flex;align-items:center;gap:8px;font-size:14px;color:#4A5D78\">Sort by\n<sc-raw-select sc-camel-on-change=\"{{ onSort }}\" style=\"font-family:inherit;font-size:15px;font-weight:600;color:#0051A5;background:#FFFFFF;border:1px solid #B9C7DB;border-radius:8px;padding:8px 10px;min-height:40px;cursor:pointer\">\n<sc-for list=\"{{sortOpts}}\" as=\"so\" hint-placeholder-count=\"3\"><option value=\"{{ so.value }}\" selected=\"{{ so.sel }}\">{{ so.label }}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{showMine}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"background:#FFFFFF;border:1px solid #D9E2EE;border-radius:14px;padding:4px 32px 0\">\n<div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,6fr) minmax(0,3fr) minmax(0,3fr);gap:24px;padding:14px 0;border-bottom:1px solid #D9E2EE;font-size:12px;font-weight:700;letter-spacing:0.08em;color:#4A5D78\"><div>RAISED<\u002Fdiv><div>ISSUE<\u002Fdiv><div>STAGE<\u002Fdiv><div>STATUS<\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{ myEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:22px 0;font-size:15px;color:#4A5D78;border-bottom:1px solid #D9E2EE\">{{ myEmptyText }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-for list=\"{{myLoops}}\" as=\"lp\" hint-placeholder-count=\"3\">\n<div style=\"padding:18px 0 6px;border-bottom:1px solid #D9E2EE\">\n<div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,6fr) minmax(0,3fr) minmax(0,3fr);gap:24px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:40px;line-height:1;font-weight:700;color:#0B1F3A\">{{ lp.count }}<\u002Fdiv>\n<sc-if value=\"{{ lp.canMeToo }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" aria-pressed=\"{{ lp.meToo }}\" aria-label=\"{{ lp.meTooAria }}\" sc-camel-on-click=\"{{ lp.toggleMeToo }}\" style=\"{{ lp.meTooStyle }}\">{{ lp.meTooLabel }}<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<div style=\"font-family:'Alegreya Sans','Inter',sans-serif;font-size:23px;font-style:italic;line-height:1.3\">\"{{ lp.said }}\"<\u002Fdiv>\n<div style=\"font-size:13px;color:#4A5D78;margin-top:6px\">{{ lp.meta }}<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:14px;font-weight:700;color:#0B1F3A;margin-bottom:8px\">{{ lp.stageName }}<\u002Fdiv>\n<div style=\"display:flex\" role=\"img\" aria-label=\"{{ lp.stageAria }}\">\n<sc-for list=\"{{ lp.bars }}\" as=\"sg\" hint-placeholder-count=\"4\"><div style=\"flex:1;min-width:0\"><div style=\"{{ sg.barStyle }}\"><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"{{ lp.shortStyle }}\">{{ lp.statusShort }}<\u002Fdiv>\n<\u002Fdiv>\n<details>\n<summary style=\"font-size:14px;font-weight:600;color:#0051A5;min-height:44px;display:flex;align-items:center\">Details and history<\u002Fsummary>\n<div style=\"{{ lp.statusStyle }}\">{{ lp.statusLine }}<\u002Fdiv>\n<ol style=\"margin:12px 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px\">\n<sc-for list=\"{{ lp.history }}\" as=\"h\" hint-placeholder-count=\"3\">\n<li style=\"font-size:14px;line-height:1.5;color:#2B4468\"><s :pointer;min-height:44px'}));\nconst navDefs = {\nstudent:[['home','Home'],['career','Career path'],['updates','Feedback tracker'],['reader','Browser extension']],\nmentor:[['mentee','My mentees'],['updates','Feedback tracker']],\ncoord:[['insights','Insights'],['updates','Feedback tracker']]\n}[s.role];\nconst nav = navDefs.map((d) => ({label:d[1], pick:() => this.setState({view:d[0]}), style: s.view===d[0]\n? 'background:none;color:#0051A5;border:none;border-bottom:3px solid #FEDF01;font-weight:700;font-size:16px;padding:10px 2px;cursor:pointer;min-height:44px'\n\n: 'background:none;color:#4A5D78;border:none;border-bottom:3px solid transparent;font-weight:600;font-size:16px;padding:10px 2px;cursor:pointer;min-height:44px'}));\n\n// pulse form\nconst programs = ['Quest','Boost'].map((p) => ({label:p, style:chip(s.program===p), pick:() => this.setState({program:p})}));\nconst topics = ['Onboarding','Mentorship','Training','Team','Career'].map((t) => ({label:t, style:chip(s.topic===t), pick:() => this.setState({topic:t})}));\nconst moodBtn = (on, bg, fg) => 'flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:12px;cursor:pointer;min-height:44px;' + (on ? ('background:' + bg + ';color:' + fg + ';border:2px solid ' + fg) : 'background:#FFFFFF;color:#4A5D78;border:2px solid #B9C7DB');\nconst readyToSend = s.mood !== '' && (!s.share || s.text.trim() !== '');\nconst submitStyle = readyToSend\n? 'background:#0051A5;color:#FFFFFF;border:none;font-weight:700;font-size:16px;padding:15px;border-radius:12px;cursor:pointer;min-height:44px'\n: 'background:#D9E2EE;color:#4A5D78;border:none;font-weight:700;font-size:16px;padding:15px;border-radius:12px;cursor:not-allowed;min-height:44px';\n\n// career data\nconst role = ROLES[s.roleKey];\nconst rate = (name, n) => { const r = {...this.state.ratings}; r[name] = n; this.setState({ratings:r}); };\nconst addPlan = (name) => { const pl = this.state.plan; this.setState({plan: pl.includes(name) ? pl.filter((x) => x !== name) : [...pl, name]}); };\nconst LV = [['Aware','You know what it is but have not used it.'],['Learning','You have used it in a course or tutorial, with guidance.'],['Working','You do routine tasks on your own and ask for help on harder ones.'],['Proficient','You handle complex work independently and others ask you for help.'],['Expert','You design the approach, review work from others and can teach it.']];\nconst SK = {\n'SQL':'Know what a database and a query are|Write simple SELECT queries with filters|Join tables and aggregate results on my own|Write and tune complex queries, use window functions|Design schemas and coach others on performance',\n'Python':'Know what it is and read short scripts|Write small scripts with a tutorial open|Build scripts and use libraries without help|Structure larger programs, write tests, review code|Design systems in it and mentor others',\n'Data visualization':'Can read a chart|Make basic charts from clean data|Build a clear dashboard for one audience|Choose the right chart for the question and tell the story|Set standards and coach others on design',\n'Statistics':'Know mean, median and spread|Run basic tests with guidance|Pick and run the right test and explain the results|Design experiments and check assumptions|Develop new methods and review the analyses of others',\n'Communication':'Share updates when asked|Write clear emails and short updates|Present a project readout to my team|Tailor a message for senior or non-technical audiences|Lead meetings and coach others on communicating',\n'Networking basics':'Know what IP, DNS and a firewall are|Explain how a request travels across a network|Troubleshoot common connectivity issues|Analyze traffic and design secure network setups|Architect networks and teach others',\n'SIEM tools':'Know what a SIEM does|Follow a runbook to review alerts|Triage alerts and build simple searches on my own|Write detection rules and tune noisy alerts|Design detection strate ploy and monitor a service on my own|Design for cost, scale and reliability|Architect platforms and teach others',\n'CI/CD':'Know what a build pipeline is|Run an existing pipeline|Edit pipelines to build and test my project|Design pipelines with staged deploys|Own pipeline strategy and coach others',\n'Machine learning':'Know what a model is|Train a simple model from a tutorial|Build and evaluate models on my own|Tune, validate and deploy models|Design ML approaches and mentor others'\n};\nconst skills = role.skills.map((a) => {\nconst name = a[0], need = a[1];\nconst parts = (SK[name] || '').split('|');\nconst mine = s.ratings[name] !== undefined ? s.ratings[name] : 2;\nconst gap = need - mine;\nconst planned = s.plan.includes(name);\nreturn {\nname, need, mine, gap, ok: gap <= 0, res: RES[name] || ('Course: ' + name), links:(RESL[name] || []).map((r) => { const on = s.plan.includes(r.title); return {title:r.title, meta:r.site + ' · ' + r.kind + ' · ' + r.time, href:'#', inPlan:on, label:on ? '✓ In plan' : 'Add to plan', toggle:() => addPlan(r.title),\nbtnStyle: on ? 'background:#E6F4EA;color:#0B6B2E;border:2px solid #0B6B2E;font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;min-height:44px;flex:none' : 'background:#0051A5;color:#FFFFFF;border:2px solid #0051A5;font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;min-height:44px;flex:none'}; }), youName: LV[mine - 1][0], youDesc: parts[mine - 1] || '', needName: LV[need - 1][0], needDesc: parts[need - 1] || '',\nokStyle: gap > 0 ? 'display:none' : 'margin-left:10px;color:#0B6B2E;font-size:20px;font-weight:800',\nneedHide: gap > 0 ? '' : 'display:none',\nnoteStyle: gap > 0 ? 'color:#8A6A00;font-weight:700' : 'color:#0B6B2E;font-weight:700',\nhlStyle: gap > 0 ? 'background:#FFF1A8;color:#3F3200;font-weight:700;padding:1px 6px;border-radius:4px;border-bottom:2px solid #C9A800' : 'background:#E6F4EA;color:#0B6B2E;font-weight:700;padding:1px 6px;border-radius:4
